# Na Netlify: aplikacja (pliki z katalogu głównego kopiowane do dist/) + funkcja do wspólnych danych.
# Na GitHub Pages ten plik nie ma znaczenia — tam strona idzie prosto z katalogu głównego.
[build]
  command = "mkdir -p dist && cp index.html sw.js manifest.webmanifest favicon.svg *.png dist/ && cp -r licencje-fontow dist/"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Service worker i strona zawsze świeże, żeby aktualizacje docierały na telefon.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
